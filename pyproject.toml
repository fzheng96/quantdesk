[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantdesk"
version = "0.1.0"
description = "Quantitative trading research platform: market data, backtesting, risk controls, and paper trading"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "typer",
    "rich",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
quantdesk = "quantdesk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["quantdesk"]
